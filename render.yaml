services:
  - type: web
    name: chess-helper-web
    runtime: static
    branch: main
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./web
    autoDeploy: true
    headers:
      - path: /vendor/*.wasm
        name: Content-Type
        value: application/wasm
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
