name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install dependencies
        run: npm install
      - name: Check desktop JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
      - name: Build browser app and verify Stockfish assets
        run: |
          npm run build:web
          test -s web/app.js
          test -s web/vendor/stockfish-19-lite-single.js
          test -s web/vendor/stockfish-19-lite-single.wasm
