name: Verify project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install dependencies
        run: npm install
      - name: Check desktop and extension JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check extension/content.js
          node --check scripts/build-extension.js
      - name: Build browser app and Chrome extension
        run: |
          npm run build:web
          npm run build:extension
          test -s web/app.js
          test -s web/vendor/stockfish-19-lite-single.js
          test -s web/vendor/stockfish-19-lite-single.wasm
          test -s extension/popup.js
          test -s extension/vendor/stockfish-19-lite-single.js
          test -s extension/vendor/stockfish-19-lite-single.wasm
          node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3) process.exit(1)"
